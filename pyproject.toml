# Ramazan/ — общая гигиена трёх проектов (EyeConnect-Ramazan, magnetcursor, hybrid).
# Python 3.11, Windows. Код проектов не трогаем — конфиг только фиксирует
# осознанные исключения.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Оставляем включёнными именно эти категории (остальное не селектим):
# F401 — неиспользуемые импорты, B023 — замыкание на переменную цикла,
# UP — pyupgrade, SIM102 — схлопываемые if, RUF059 — неиспользуемые распаковки,
# I001 — сортировка импортов. Это принятые категории: править код под них
# нельзя (запрет трогать проекты), фиксируем как известные.
select = ["F401", "B023", "UP", "SIM102", "RUF059", "I001"]
# Оборонный стиль проекта: широкие except (камера/UIA/COM падают постоянно)
# и try/except-pass/continue в рантайм-коде — осознанно приняты, не селектим.
# Здесь дублируем как документацию принятого исключения.
ignore = ["BLE001", "S110", "S112"]
