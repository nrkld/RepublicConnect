[project]
name = "eyeconnect"
version = "0.2.0"
description = "Low-cost gaze cursor + dwell keyboard (KZ/RU/EN)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24,<2.0",
  "scikit-learn>=1.3",
  "pillow>=10.0",
  "mediapipe>=0.10.21",
  "eyetrax>=0.2.2",
  "torch>=2.0",
  "torchvision>=0.15",
  "safetensors>=0.4",
  "huggingface_hub>=0.20",
  "unigaze>=0.1.3",
  "face-alignment>=1.5.0",
  "timm==0.3.2",
  "scikit-image>=0.21",
  "tqdm>=4.60",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eyeconnect*"]
